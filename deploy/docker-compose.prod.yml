# Production overlay (SPEC §11, §12): 2 API replicas, read-only FS, non-root, TLS on 443.
x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "10" }

services:
  postgres:
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    shm_size: 1g
    restart: always
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "10" }

  redis:
    restart: always

  api:
    <<: *hardening
    tmpfs: ["/tmp"]
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "3", memory: 3g }
    restart: always

  worker:
    <<: *hardening
    tmpfs: ["/tmp"]
    restart: always

  web:
    ports: ["${HTTP_PORT:-80}:8080", "${HTTPS_PORT:-443}:8443"]
    environment:
      NGINX_ALWAYS_TLS_REDIRECT: "on"
      SSL_CERT_FILE: /etc/nginx/ssl/server.crt
      SSL_CERT_KEY_FILE: /etc/nginx/ssl/server.key
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: always
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "10" }

  backup:
    restart: always
