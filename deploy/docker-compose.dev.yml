# Development overlay: exposes ports, adds Mailpit (test SMTP) and pgAdmin (profile "tools").
services:
  postgres:
    ports: ["${DEV_PG_PORT:-5442}:5432"]
  redis:
    ports: ["${DEV_REDIS_PORT:-6395}:6379"]
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Auth__CookieSecure: "false"
      Seed__SmtpHost: mailpit
      Seed__VddMockUrl: http://mock-vdd:8080
    ports: ["${DEV_API_PORT:-5080}:8080"]
  worker:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
  web:
    ports: ["8080:8080", "8443:8443"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]
    networks: [backend]
  # Mock of the Viện Dinh dưỡng data portal (tools/mock-vdd-api, contract in its README — A-25)
  mock-vdd:
    build:
      context: ../tools/mock-vdd-api
    image: bluemeal/mock-vdd:${BLUEMEAL_VERSION:-dev}
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports: ["${DEV_MOCK_VDD_PORT:-5090}:8080"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4:9
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bluemeal.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports: ["5050:80"]
    networks: [backend]
