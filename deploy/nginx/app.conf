# Shared locations for HTTP (dev / behind TLS terminator) and HTTPS servers.
root /usr/share/nginx/html;
index index.html;
client_max_body_size 25m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

set $bm_csp "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$csp_nonce'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

include /etc/nginx/bluemeal/security-headers.conf;

location /api/ {
    limit_req zone=bm_api burst=200 nodelay;
    proxy_pass http://bluemeal_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_buffering on;
    # nginx is authoritative for security headers (security-headers.conf): drop the API's copies to avoid duplicates
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header Strict-Transport-Security;
}

location /health/ {
    access_log off;
    proxy_pass http://bluemeal_api;
    proxy_set_header Host $host;
}

location /swagger {
    proxy_pass http://bluemeal_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Hashed build assets: cache for a year.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/bluemeal/security-headers.conf;
    try_files $uri =404;
}

# SPA entry: never cached, CSP nonce injected.
location / {
    try_files $uri /index.html;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter '__CSP_NONCE__' $csp_nonce;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/bluemeal/security-headers.conf;
}
