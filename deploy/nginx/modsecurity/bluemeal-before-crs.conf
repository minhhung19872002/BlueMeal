# BlueMeal CRS exclusions (paranoia level 1). Keep this list minimal and documented (SPEC §10.5).
# Rule IDs 10000-10999 are reserved for BlueMeal.

# Credentials are free-form by policy (special characters required) — do not inspect them for injection patterns.
SecRule REQUEST_URI "@rx ^/api/v1/(auth|profile|users)/" \
    "id:10001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.currentPassword,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.newPassword,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.captchaAnswer"

# Recipe instructions / notes are long Vietnamese free text (may contain words like "select", "union", quotes).
SecRule REQUEST_URI "@rx ^/api/v1/(recipes|dishes|menus|inspections|samples)" \
    "id:10002,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.instructions,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.instructions,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.note"

# Excel import uploads are binary (xlsx = zip) — size/MIME are validated by the API.
SecRule REQUEST_URI "@rx /import/(preview|commit)$" \
    "id:10003,phase:1,pass,nolog,ctl:ruleRemoveById=920420,ctl:ruleRemoveById=922110"

# Integration mapping JSON is configuration content edited by admins.
SecRule REQUEST_URI "@beginsWith /api/v1/integration" \
    "id:10004,phase:1,pass,nolog,ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.mappingJson"
